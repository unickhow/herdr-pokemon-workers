    var cv = card.querySelector("canvas"); cv.width = SW; cv.height = SH; cards.appendChild(card);
    live.push({ cv: cv, sc: sc, id: S.id });
  });
  var CAST_LOOK = { working: "working", sleep: "sleep", done: "done", idle: "idle" };
  function frame(now) {
    NOW = now; var t = Math.floor(now / 166);
    live.forEach(function (L) {
      var g = L.cv.getContext("2d"); g.clearRect(0, 0, SW, SH); g.drawImage(L.sc.cv, 0, 0);
      var cast = L.sc.post.cast.slice().sort(function (a, b) { return a[3] - b[3]; });
      cast.forEach(function (c, i) { STATE_AT = 0; drawBig(g, c[0], CAST_LOOK[c[1]], c[2] - 16, c[3] - 32, t + i); });
      if (L.id === "b") for (var f = 0; f < 18; f++) { var fx = 20 + (hash(f, 1) % 216) + Math.sin(now / 1300 + f) * 6, fy = 40 + (hash(f, 2) % 100) + Math.cos(now / 1700 + f * 2) * 5, gl = 0.35 + 0.65 * Math.max(0, Math.sin(now / 500 + f * 1.7)); g.fillStyle = "rgba(255,240,150," + gl.toFixed(2) + ")"; g.fillRect(Math.round(fx), Math.round(fy), 1, 1); g.fillStyle = "rgba(255,240,150," + (gl * 0.25).toFixed(2) + ")"; g.fillRect(Math.round(fx) - 1, Math.round(fy), 3, 1); }
      if (L.id === "d") for (var p = 0; p < 12; p++) { var px = (hash(p, 3) % SW + now / 60 * (0.5 + (p % 3) * 0.3)) % SW, py = 20 + ((hash(p, 4) % 130) + now / 90 + Math.sin(now / 700 + p) * 6) % 130; g.fillStyle = "#ffc9d6"; g.fillRect(Math.round(px), Math.round(py), 2, 1); }
      if (L.id === "a") for (var b = 0; b < 3; b++) { var bx = (now / 40 + b * 90) % 300 - 20, by = 40 + b * 12 + Math.sin(now / 400 + b) * 4; g.fillStyle = "#ffffff"; g.fillRect(Math.round(bx), Math.round(by), 3, 1); g.fillRect(Math.round(bx) + 1, Math.round(by) - 1, 1, 1); }
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
